<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planeta 3D</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #05060d; }
      body { font-family: system-ui, sans-serif; color: #e8ecf5; }
      canvas { display: block; }
      #aviso { position: fixed; inset: 0; display: none; place-items: center; padding: 2rem;
               text-align: center; font-size: 1.2rem; line-height: 1.5; }
      #hud { position: fixed; left: 12px; bottom: 10px; font-size: 13px; opacity: .75;
             pointer-events: none; text-shadow: 0 1px 2px #000; white-space: pre; }
      /* Letrero junto al ratón y ficha de lo enfocado (D-22). Sin fuentes de internet (R8). */
      #pista { position: fixed; display: none; pointer-events: none; padding: 4px 10px;
               border-radius: 999px; font-size: 13px; background: rgba(255, 214, 120, .92);
               color: #2a1a00; font-weight: 600; box-shadow: 0 2px 10px rgba(255, 190, 80, .5); }
      #ficha { position: fixed; top: 50%; right: 28px; width: min(380px, calc(100vw - 56px));
               max-height: calc(100vh - 56px); overflow-y: auto; box-sizing: border-box;
               padding: 22px 24px 20px; border-radius: 18px;
               background: linear-gradient(160deg, rgba(40, 26, 6, .88), rgba(12, 10, 24, .9));
               border: 1px solid rgba(255, 210, 120, .45);
               box-shadow: 0 0 40px rgba(255, 190, 80, .25), inset 0 0 30px rgba(255, 200, 100, .06);
               backdrop-filter: blur(6px); line-height: 1.45; font-size: 14px;
               opacity: 0; pointer-events: none; transform: translate(24px, -50%);
               transition: opacity .45s ease, transform .45s ease; }
      #ficha.visible { opacity: 1; pointer-events: auto; transform: translate(0, -50%); }
      .ficha-chispa { font-size: 30px; line-height: 1; filter: drop-shadow(0 0 10px #ffd27a); }
      .ficha-titulo { margin: 6px 0 2px; font-size: 30px; letter-spacing: .02em;
                      background: linear-gradient(90deg, #fff3c4, #ffc94d, #ff9a3c);
                      -webkit-background-clip: text; background-clip: text; color: transparent; }
      .ficha-subtitulo { margin: 0 0 12px; font-size: 12px; text-transform: uppercase;
                         letter-spacing: .12em; color: #ffd27a; }
      .ficha-parrafo { margin: 0 0 10px; color: #f2ead8; }
      .ficha-datos { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 14px 0;
                     padding: 10px 12px; border-radius: 10px; background: rgba(255, 210, 120, .08); }
      .ficha-datos dt { color: #ffcf6b; font-weight: 600; }
      .ficha-datos dd { margin: 0; color: #fff; }
      .ficha-lema { margin: 12px 0 16px; font-style: italic; font-size: 15px; color: #ffe6a8;
                    text-align: center; }
      .ficha-volver { width: 100%; padding: 10px; border: 0; border-radius: 10px; cursor: pointer;
                      font: inherit; font-weight: 600; color: #2a1a00;
                      background: linear-gradient(90deg, #ffe08a, #ffb347); }
      .ficha-volver:hover { filter: brightness(1.08); }
    </style>
  </head>
  <body>
    <div id="aviso"></div>
    <div id="hud"></div>
    <div id="pista"></div>
    <aside id="ficha" aria-live="polite"></aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
